name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned: a newer ruff changes both the rules in force and the formatting it expects.
          pip install pytest playwright "ruff==0.15.7"

      - name: Install browser engines
        run: playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: |
          ruff check .
          ruff format --diff .

      - name: Test
        run: python -m pytest -p no:randomly
        env:
          # The suite builds its own repository, so git needs an identity to commit with.
          GIT_AUTHOR_NAME: desk
          GIT_AUTHOR_EMAIL: desk@example.com
          GIT_COMMITTER_NAME: desk
          GIT_COMMITTER_EMAIL: desk@example.com
